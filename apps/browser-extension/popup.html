<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Macron Browser Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141416;
      --surface: #1b1b1e;
      --elev: #26262c;
      --border: #34343b;
      --text: #eaeaef;
      --muted: #9696a0;
      --accent: #cbd4eb;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      padding: 14px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 8px; border-radius: 999px; font-size: 11px;
      background: var(--elev); border: 1px solid var(--border); color: var(--muted);
    }
    .pill.on { color: var(--ok); border-color: rgba(52, 211, 153, 0.4); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; margin-bottom: 10px;
    }
    label { display: block; font-size: 11px; color: var(--muted); margin: 6px 0 4px; }
    label:first-child { margin-top: 0; }
    input {
      width: 100%; padding: 7px 9px; border-radius: 7px;
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    button {
      flex: 1; padding: 7px 10px; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--border); background: var(--elev); color: var(--text);
      font-size: 12px; font-weight: 500;
    }
    button.primary { background: var(--accent); color: #141416; border-color: transparent; }
    button:hover { filter: brightness(1.08); }
    .site { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .origin { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-family: ui-monospace, monospace; font-size: 11px; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="head">
    <span class="title">Macron Browser Bridge</span>
    <span id="status-pill" class="pill"><span class="dot"></span><span id="status-txt">Disconnected</span></span>
  </div>

  <div class="card">
    <label for="endpoint">Macron Desktop Endpoint</label>
    <input id="endpoint" placeholder="ws://127.0.0.1:.../api/browser/extension/ws" />
    <label for="token">Pairing Token</label>
    <input id="token" type="password" placeholder="Paste token from Macron Settings" />
    <div class="row">
      <button id="connect-btn" class="primary">Connect</button>
      <button id="disconnect-btn">Disconnect</button>
    </div>
  </div>

  <div class="card" id="site-card" style="display:none">
    <div class="site">
      <span id="current-origin" class="origin"></span>
      <button id="approve-btn" style="flex:0 0 auto; padding:4px 9px;"></button>
    </div>
    <div class="row">
      <button id="attach-btn">Add tab to "Macron" group</button>
    </div>
    <div class="hint">Only approved sites inside the Macron Tab Group can be accessed.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
