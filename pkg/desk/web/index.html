<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Macron</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/code.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Macron</div>
    <button class="nav-btn" id="addFolder" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Open a folder</button>
    <div class="side-label">Workspaces</div>
    <nav class="projects" id="projects"></nav>
    <div class="side-foot">
      <button class="nav-btn" id="openSettings" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></svg>Settings</button>
      <div class="engine" id="engine"><span class="dot"></span><span class="engine-text">Connecting…</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="icon-btn menu" id="toggleSide" type="button" title="Workspaces"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="title">
        <h1 id="pname">Macron</h1>
        <span id="ppath" class="path"></span>
      </div>
      <div class="controls">
        <div class="seg" id="mode">
          <button type="button" data-mode="build">Build</button>
          <button type="button" data-mode="plan">Plan</button>
        </div>
        <button class="model-btn" id="modelBtn" type="button"><span class="model-name" id="modelName">…</span><svg class="i sm" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
        <button class="icon-btn" id="newChat" type="button" title="New conversation (Ctrl+N)"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h8M15.5 4.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg></button>
      </div>
    </header>
    <section class="feed" id="feed"><div class="feed-inner" id="feedInner"></div></section>
    <div class="live" id="live"></div>
    <footer class="composer">
      <div class="box" id="box">
        <textarea id="input" rows="1" dir="auto" placeholder="Ask Macron to build, fix, research or automate something"></textarea>
        <div class="box-actions">
          <span class="queued" id="queued"></span>
          <button class="stop" id="stop" type="button" title="Stop (Esc)"><svg class="i xs solid" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
          <button class="send" id="send" type="button" title="Send (Enter)"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
        </div>
      </div>
      <div class="hints" id="hints"><span>Enter to send · Shift+Enter for a new line · / for commands</span><span id="usage"></span></div>
    </footer>
  </main>
</div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
