name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y python3 ffmpeg
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare document and media tools
        run: |
          python3 -m venv "$RUNNER_TEMP/macron-tools"
          "$RUNNER_TEMP/macron-tools/bin/python" -m pip install --require-hashes -r requirements-tools.lock
          echo "$RUNNER_TEMP/macron-tools/bin" >> "$GITHUB_PATH"
      - run: make check
      - name: the installer parses
        run: bash -n install.sh
      - name: the desktop interface bundle matches its source
        run: |
          make ui
          git diff --exit-code pkg/desk/web

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o macron.exe ./cmd/macron
      - run: go build -ldflags "-H windowsgui -X main.launch=desktop" -o macron-desktop.exe ./cmd/macron
      - run: .\macron.exe version
      - name: regression tests on Windows
        run: go test -count=1 ./...
      - name: the desktop engine and a full agent job on Windows, x64 and x86
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "386"
          go build -o macron-386.exe ./cmd/macron
          $env:GOARCH = "amd64"
          tests/desktop/engine.ps1 -Exe "$PWD\macron.exe" -Gui "$PWD\macron-desktop.exe"
          tests/desktop/engine.ps1 -Exe "$PWD\macron-386.exe"
      - name: the desktop app in Edge, with a server over SSH
        shell: pwsh
        run: |
          go build -o sshd-test.exe ./tests/desktop/sshd
          tests/desktop/ui.ps1 -Exe "$PWD\macron.exe" -Sshd "$PWD\sshd-test.exe"
      - name: build and test the universal Windows installer
        shell: pwsh
        run: tests/windows/build-installer.ps1
      - name: the Windows installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y python3 ffmpeg
      - name: race detector and regression tests
        run: make test-race
      - name: static analysis
        run: make lint
      - name: known vulnerabilities in Go and the modules
        run: make vuln

  clean-install:
    runs-on: ubuntu-24.04
    env:
      BOT_TOKEN: ${{ secrets.MACRON_CI_BOT_TOKEN }}
      OWNER: ${{ secrets.MACRON_CI_OWNER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: make build
      - name: one-line install (this build, tools and venv included)
        run: bash install.sh --binary ./bin/macron --source-dir . --yes --no-service
      - name: the installed program works
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          macron version
          macron doctor --tools-only
      - name: a second run keeps the settings
        run: |
          mkdir -p ~/.macron && printf 'TELEGRAM_BOT_TOKEN=x\nMACRON_OWNERS=1\n' > ~/.macron/config.env
          bash install.sh --binary ./bin/macron --no-tools --yes --no-service | tee out.txt
          grep -q "settings in" out.txt && grep -q 'TELEGRAM_BOT_TOKEN=x' ~/.macron/config.env
      - name: as a service, answering Telegram
        if: ${{ env.BOT_TOKEN != '' }}
        run: |
          sudo install -m 0755 ./bin/macron /usr/local/bin/macron
          sudo mkdir -p /root/.macron
          printf 'TELEGRAM_BOT_TOKEN=%s\nMACRON_OWNERS=%s\n' "$BOT_TOKEN" "$OWNER" | sudo tee /root/.macron/config.env >/dev/null
          sudo chmod 600 /root/.macron/config.env
          sudo -H macron --check | grep -q "^ok "
          sudo -H macron service install
          sleep 5
          sudo systemctl is-active macron.service
