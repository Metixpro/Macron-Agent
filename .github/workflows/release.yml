name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: the tag is the version in the code
        run: |
          version="$(sed -n 's/^const Version = "\(.*\)"/\1/p' pkg/app/app.go)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$tag" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pkg/app/app.go says $version"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is released already: raise the version in pkg/app/app.go first"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: make release
      - name: publish as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          notes="Windows: download Macron-Setup-$v.exe, one installer for every Windows PC (it picks 64-bit, 32-bit or ARM by itself; no administrator rights needed). Linux and macOS: install.sh. The zips and tar.gz files are for install.ps1, install.sh and updates."
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --draft --title "Macron Agent $TAG" --notes "$notes" --generate-notes --target "$GITHUB_SHA"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
        id: draft
    outputs:
      tag: ${{ steps.draft.outputs.TAG }}

  windows-setup:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: build the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $v = $env:TAG.TrimStart("v")
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p "macron-$v-windows-*.zip" -D zips
          packaging/windows/build.ps1 -Version $v -Zips "$PWD\zips"
      - name: install, run and uninstall it
        shell: pwsh
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $v = $env:TAG.TrimStart("v")
          tests/windows/installer.ps1 -Setup "packaging/windows/out/Macron-Setup-$v.exe" -Version $v
      - name: attach it and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $v = $env:TAG.TrimStart("v")
          $setup = "packaging\windows\out\Macron-Setup-$v.exe"
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p SHA256SUMS -D sums
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          [IO.File]::AppendAllText("$PWD\sums\SHA256SUMS", "$hash  Macron-Setup-$v.exe`n")
          gh release upload $env:TAG -R $env:GITHUB_REPOSITORY $setup "sums\SHA256SUMS" --clobber
          gh release edit $env:TAG -R $env:GITHUB_REPOSITORY --draft=false --latest
