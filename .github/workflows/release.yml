name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: the tag is the version in the code
        run: |
          version="$(sed -n 's/^const Version = "\(.*\)"/\1/p' pkg/app/app.go)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$tag" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pkg/app/app.go says $version"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is released already: raise the version in pkg/app/app.go first"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: make release
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --title "Macron Agent $TAG" --generate-notes --target "$GITHUB_SHA"
